<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img">
<defs><clipPath id="card"><rect width="880" height="340" rx="18"/></clipPath>
<linearGradient id="gt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#8b5cff"/><stop offset="0.25" stop-color="#ff4fa3"/><stop offset="0.5" stop-color="#ffb84d"/><stop offset="0.75" stop-color="#2ee6c5"/><stop offset="1" stop-color="#8b5cff"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#8b5cff"/><stop offset="0.25" stop-color="#ff4fa3"/><stop offset="0.5" stop-color="#ffb84d"/><stop offset="0.75" stop-color="#2ee6c5"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cff"/><stop offset="0.25" stop-color="#ff4fa3"/><stop offset="0.5" stop-color="#ffb84d"/><stop offset="0.75" stop-color="#2ee6c5"/><stop offset="1" stop-color="#8b5cff"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="9s" repeatCount="indefinite"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="glow2" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
<radialGradient id="rv"><stop offset="0" stop-color="#8b5cff" stop-opacity="0.6"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></radialGradient><radialGradient id="rm"><stop offset="0" stop-color="#ff4fa3" stop-opacity="0.5"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient><radialGradient id="rt"><stop offset="0" stop-color="#2ee6c5" stop-opacity="0.42"/><stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/></radialGradient><radialGradient id="ra"><stop offset="0" stop-color="#ffb84d" stop-opacity="0.35"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></radialGradient></defs>
<style>
.d{font-family:'SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:.16em}
.ink{fill:#f1f0ff}.ink2{fill:#b4b6d9}.ink3{fill:#6d7099}
.blob{animation:drift 14s ease-in-out infinite alternate}
.b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,-40px) scale(1.25)}}
.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation-delay:.8s}.tw3{animation-delay:1.6s}.tw4{animation-delay:2.4s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes ring{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(3.2);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.big{font-family:'SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:60px;letter-spacing:-.035em}
.wv{animation:wv 9s linear infinite}
@keyframes wv{to{transform:translateX(-440px)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)">
