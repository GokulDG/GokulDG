<style>
.d{font-family:'SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:.16em}
.ink{fill:#f1f0ff}.ink2{fill:#b4b6d9}.ink3{fill:#6d7099}
.blob{animation:drift 14s ease-in-out infinite alternate}
.b2{animation-duration:19s;animation-direction:alternate-reverse}.b3{animation-duration:23s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,-40px) scale(1.25)}}
.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation-delay:.8s}.tw3{animation-delay:1.6s}.tw4{animation-delay:2.4s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes ring{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(3.2);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.name{font-family:'SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:96px;letter-spacing:-.035em}
.rise{animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.dot{animation:blink 1.8s ease-in-out infinite}
.core{transform-box:fill-box;transform-origin:center;animation:core 3.4s ease-in-out infinite}
@keyframes core{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ph{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14.5px;fill:#b4b6d9;opacity:0;animation:ph 12s infinite}
.ph1{opacity:1}.ph2{animation-delay:4s}.ph3{animation-delay:8s}
@keyframes ph{0%{opacity:0;transform:translateY(10px)}3%,30%{opacity:1;transform:translateY(0)}33.3%,100%{opacity:0;transform:translateY(-10px)}}
.fact{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.shoot{animation:shoot 7s ease-in infinite}
@keyframes shoot{0%,70%{transform:translate(0,0);opacity:0}72%{opacity:1}86%,100%{transform:translate(-460px,230px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
